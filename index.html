<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Viaa 💗</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    color:white;
}

/* =========================
   SLIDE
========================= */

.page{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px 18px;

    opacity:0;
    visibility:hidden;
    transform:scale(1.08);

    transition:
        opacity .8s ease,
        transform 1s ease,
        visibility .8s;

    overflow:hidden;
}

.page.active{
    opacity:1;
    visibility:visible;
    transform:scale(1);
}


/* =========================
   BACKGROUND TIAP SLIDE
========================= */

#page1{
    background:
    radial-gradient(circle at 20% 20%,#ff9fc8,transparent 28%),
    radial-gradient(circle at 80% 80%,#9d7cff,transparent 30%),
    linear-gradient(135deg,#160d29,#35133f,#5d2850);
}

#page2{
    background:
    radial-gradient(circle at 80% 15%,#ffbad7,transparent 30%),
    radial-gradient(circle at 15% 85%,#ffd39d,transparent 32%),
    linear-gradient(135deg,#652346,#c44e76,#ff9dbd);
}

#page3{
    background:
    radial-gradient(circle at 50% 5%,#fbcde1,transparent 35%),
    radial-gradient(circle at 10% 90%,#8e78d8,transparent 30%),
    linear-gradient(135deg,#191832,#403866,#76639c);
}

#page4{
    background:
    radial-gradient(circle at 10% 10%,#7060ff,transparent 28%),
    radial-gradient(circle at 90% 90%,#ff77ac,transparent 30%),
    linear-gradient(135deg,#11132c,#292047,#552d54);
}

#page5{
    background:
    radial-gradient(circle at 50% 10%,#ffc38e,transparent 32%),
    radial-gradient(circle at 10% 90%,#e8868d,transparent 30%),
    linear-gradient(135deg,#2b1825,#65382e,#a56446);
}

#page6{
    background:
    radial-gradient(circle at 20% 15%,#a995ff,transparent 30%),
    radial-gradient(circle at 85% 85%,#ff9bc9,transparent 30%),
    linear-gradient(135deg,#15142e,#302149,#59324f);
}

#page7{
    background:
    radial-gradient(circle at 50% 20%,#ffbdd9,transparent 35%),
    radial-gradient(circle at 15% 85%,#b49eff,transparent 30%),
    linear-gradient(135deg,#20132d,#522346,#8d4e75);
}


/* =========================
   PARTICLE
========================= */

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.particle{
    position:absolute;
    color:white;
    opacity:.6;
    animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.6);
    }

    50%{
        opacity:1;
        transform:scale(1.4);
    }
}


/* =========================
   CARD
========================= */

.box{
    position:relative;
    z-index:10;

    width:100%;
    max-width:450px;
    max-height:88vh;

    overflow-y:auto;

    padding:34px 24px;

    text-align:center;

    border:1px solid rgba(255,255,255,.25);

    border-radius:32px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
    0 25px 70px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.2);

    animation:cardAppear 1s ease;
}

.box::-webkit-scrollbar{
    width:0;
}

@keyframes cardAppear{
    from{
        opacity:0;
        transform:translateY(40px) scale(.94);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}


/* =========================
   TEXT
========================= */

h1{
    font-size:29px;
    line-height:1.3;
    margin-bottom:17px;

    text-shadow:
    0 5px 20px rgba(0,0,0,.25);
}

h2{
    font-size:24px;
    margin-bottom:18px;
}

.typing{
    min-height:30px;
    font-size:16px;
    line-height:1.85;

    color:rgba(255,255,255,.94);
}

.cursor{
    display:inline-block;
    width:2px;
    height:18px;

    background:white;

    margin-left:3px;

    animation:blink .7s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}


/* =========================
   HEART
========================= */

.big-heart{
    font-size:72px;
    margin-bottom:15px;

    filter:
    drop-shadow(0 8px 20px rgba(255,100,180,.4));

    animation:heartbeat 1.5s infinite;
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.15);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.1);
    }
}


/* =========================
   BUTTON
========================= */

button{
    margin-top:27px;

    border:1px solid rgba(255,255,255,.35);

    padding:14px 27px;

    border-radius:50px;

    background:rgba(255,255,255,.16);

    color:white;

    font-size:15px;
    font-weight:bold;

    backdrop-filter:blur(10px);

    box-shadow:
    0 10px 30px rgba(0,0,0,.2),
    inset 0 1px 0 rgba(255,255,255,.2);

    cursor:pointer;

    transition:.3s;
}

button:hover{
    transform:translateY(-3px) scale(1.04);
    background:rgba(255,255,255,.25);
}

button:active{
    transform:scale(.94);
}


/* =========================
   PHOTO
========================= */

.photo-frame{
    padding:10px;

    background:white;

    border-radius:8px;

    margin-bottom:23px;

    box-shadow:
    0 20px 45px rgba(0,0,0,.35);

    transform:rotate(-2deg);

    transition:.5s;
}

.photo-frame:hover{
    transform:rotate(0deg) scale(1.03);
}

.photo{
    width:100%;
    height:285px;

    display:block;

    object-fit:cover;

    border-radius:4px;
}


/* =========================
   SIGNATURE
========================= */

.signature{
    margin-top:22px;

    font-size:15px;

    font-weight:bold;

    letter-spacing:1px;
}


/* =========================
   PROGRESS
========================= */

.progress{
    position:fixed;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:50;

    display:flex;

    gap:7px;
}

.dot{
    width:7px;
    height:7px;

    border-radius:20px;

    background:rgba(255,255,255,.3);

    transition:.4s;
}

.dot.active{
    width:23px;
    background:white;
}


/* =========================
   MUSIC BUTTON
========================= */

.music-control{
    position:fixed;

    right:18px;
    top:17px;

    z-index:60;

    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(255,255,255,.14);

    border:1px solid rgba(255,255,255,.3);

    backdrop-filter:blur(10px);

    font-size:18px;

    cursor:pointer;

    box-shadow:
    0 8px 20px rgba(0,0,0,.2);

    transition:.3s;
}

.music-control.playing{
    animation:musicPulse 1.2s infinite;
}

@keyframes musicPulse{
    50%{
        transform:scale(1.12);
    }
}


/* =========================
   FLOATING EMOJI
========================= */

.floating{
    position:fixed;

    bottom:-50px;

    z-index:4;

    pointer-events:none;

    animation:floatUp linear forwards;
}

@keyframes floatUp{

    0%{
        transform:
        translateY(0)
        rotate(0deg);

        opacity:0;
    }

    15%{
        opacity:.85;
    }

    100%{
        transform:
        translateY(-115vh)
        rotate(30deg);

        opacity:0;
    }
}


/* =========================
   ORB
========================= */

.orb{
    position:absolute;

    border-radius:50%;

    filter:blur(5px);

    opacity:.2;

    animation:orbMove 8s infinite alternate ease-in-out;
}

.orb1{
    width:180px;
    height:180px;

    top:-70px;
    left:-70px;

    background:#ff9fc9;
}

.orb2{
    width:220px;
    height:220px;

    right:-90px;
    bottom:-90px;

    background:#a18cff;

    animation-delay:2s;
}

@keyframes orbMove{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(25px,-20px);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .box{
        padding:30px 20px;
        max-height:85vh;
    }

    h1{
        font-size:27px;
    }

    h2{
        font-size:22px;
    }

    .typing{
        font-size:15px;
    }

    .photo{
        height:255px;
    }

    .big-heart{
        font-size:64px;
    }
}
</style>
</head>

<script>

/* =====================================================
   PAGE SYSTEM
===================================================== */

let currentPage = 1;

const totalPages = 7;

let typingTimer;


/* =====================================================
   NEXT PAGE
===================================================== */

function nextPage(){

    if(currentPage >= totalPages){
        return;
    }


    /* MUSIC START */

    const music =
        document.getElementById("bgMusic");

    if(music.paused){

        music.volume = 0.45;

        music.play()
        .then(()=>{

            document
            .getElementById("musicButton")
            .classList.add("playing");

        })
        .catch(()=>{});

    }


    /* PAGE */

    const oldPage =
        document.getElementById(
            "page" + currentPage
        );

    currentPage++;

    const newPage =
        document.getElementById(
            "page" + currentPage
        );

    oldPage.classList.remove("active");

    newPage.classList.add("active");


    /* PROGRESS */

    updateDots();


    /* TYPE */

    setTimeout(()=>{
        startTyping(newPage);
    },500);


    /* BURST */

    createBurst();

}


/* =====================================================
   TYPING EFFECT
===================================================== */

function startTyping(page){

    clearInterval(typingTimer);

    const element =
        page.querySelector(".typing");

    if(!element){
        return;
    }

    const text =
        element.getAttribute("data-text");

    element.innerHTML =
        '<span class="cursor"></span>';

    let index = 0;

    typingTimer =
        setInterval(()=>{

            if(index < text.length){

                element.innerHTML =
                    text.substring(0,index + 1)
                    +
                    '<span class="cursor"></span>';

                index++;

            }
            else{

                clearInterval(typingTimer);

            }

        },28);

}


/* =====================================================
   START FIRST TEXT
===================================================== */

window.addEventListener("load",()=>{

    const firstPage =
        document.getElementById("page1");

    startTyping(firstPage);

});


/* =====================================================
   DOTS
===================================================== */

function updateDots(){

    const dots =
        document.querySelectorAll(".dot");

    dots.forEach((dot,index)=>{

        dot.classList.toggle(
            "active",
            index === currentPage - 1
        );

    });

}


/* =====================================================
   MUSIC
===================================================== */

function toggleMusic(){

    const music =
        document.getElementById("bgMusic");

    const button =
        document.getElementById("musicButton");


    if(music.paused){

        music.volume = .45;

        music.play();

        button.classList.add("playing");

    }
    else{

        music.pause();

        button.classList.remove("playing");

    }

}


/* =====================================================
   FLOATING EMOJI
===================================================== */

function createFloating(){

    const element =
        document.createElement("div");

    element.className="floating";


    const emojis = [
        "💗",
        "💕",
        "💖",
        "💓",
        "🤍",
        "✨",
        "🌸",
        "🌷",
        "🥺"
    ];


    element.innerHTML =
        emojis[
            Math.floor(
                Math.random()*emojis.length
            )
        ];


    element.style.left =
        Math.random()*100 + "vw";


    element.style.fontSize =
        15 + Math.random()*20 + "px";


    element.style.animationDuration =
        5 + Math.random()*4 + "s";


    document.body.appendChild(element);


    setTimeout(()=>{

        element.remove();

    },9000);

}


setInterval(createFloating,650);


/* =====================================================
   PARTICLES
===================================================== */

document
.querySelectorAll(".particles")
.forEach(container=>{

    for(let i=0;i<40;i++){

        const particle =
            document.createElement("div");

        particle.className="particle";

        particle.innerHTML =
            Math.random()>.5
            ? "✦"
            : "•";


        particle.style.left =
            Math.random()*100+"%";


        particle.style.top =
            Math.random()*100+"%";


        particle.style.fontSize =
            5 + Math.random()*9+"px";


        particle.style.animationDelay =
            Math.random()*4+"s";


        particle.style.animationDuration =
            2 + Math.random()*4+"s";


        container.appendChild(particle);

    }

});


/* =====================================================
   HEART BURST
===================================================== */

function createBurst(){

    for(let i=0;i<10;i++){

        const heart =
            document.createElement("div");

        heart.innerHTML =
            Math.random()>.3
            ? "💗"
            : "✨";


        heart.style.position="fixed";

        heart.style.left="50%";

        heart.style.top="50%";

        heart.style.zIndex="100";

        heart.style.pointerEvents="none";

        heart.style.fontSize =
            14 + Math.random()*12+"px";


        const x =
            (Math.random()-.5)*320;

        const y =
            (Math.random()-.5)*320;


        heart.animate(

            [
                {
                    transform:
                    "translate(-50%,-50%) scale(.4)",

                    opacity:1
                },

                {
                    transform:
                    `translate(
                        calc(-50% + ${x}px),
                        calc(-50% + ${y}px)
                    )
                    scale(1.5)`,

                    opacity:0
                }

            ],

            {
                duration:1100,

                easing:"cubic-bezier(.2,.8,.3,1)"
            }

        );


        document.body.appendChild(heart);


        setTimeout(()=>{

            heart.remove();

        },1100);

    }

}

</script>
